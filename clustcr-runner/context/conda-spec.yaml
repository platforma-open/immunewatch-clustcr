# clusTCR conda environment for the runner docker image. Channels are the OOM-fixed set (the
# `pytorch` channel was dropped upstream to fix the linux-64 solver OOM). CPU-only (faiss-cpu).
#
# numpy and faiss-cpu are pinned on purpose — do NOT drop these pins:
#   * clusTCR 1.0.3 hard-pins scipy 1.8, whose import-time self-check only certifies numpy <1.25.
#     Left unpinned, the wider closure installs numpy 1.26.4 and scipy prints a benign-but-noisy
#     UserWarning on every import. Pinning numpy into scipy 1.8's certified range silences it at
#     the source.
#   * faiss-cpu is pinned to 1.7.4 (the version clusTCR was built/tested against). Once numpy is
#     constrained an unpinned faiss floats up to 1.10.0 — harmless, but an unnecessary deviation
#     from the tested env, so we hold it at 1.7.4.
# support/software-conda/clustcr keeps the original unpinned spec (unused under docker-primary).
channels:
  - svalkiers
  - bioconda
  - conda-forge

dependencies:
  - python=3.10
  - clustcr=1.0.3
  - faiss-cpu=1.7.4
  - numpy<1.25
  - polars
